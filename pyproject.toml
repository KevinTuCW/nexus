[project]
name = "nexus"
version = "0.1.0"
description = "Wanmart group AI platform — OpenAI-compatible gateway with cost attribution, routing-diversity guarantees and tenant conformance gates (阵06)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
]

[project.scripts]
nexus-eval = "nexus.eval:main"

[project.optional-dependencies]
# httpx[socks], not bare httpx: this machine (and the sibling tenant repos)
# reach providers through a SOCKS proxy, and without `socksio` every real
# call fails at connect time with an error that names the proxy rather than
# the request -- easy to misread as the provider being down.
dev = ["pytest>=8.0", "httpx[socks]>=0.27"]
llm = ["litellm>=1.50", "langfuse>=4.14"]
pg = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
