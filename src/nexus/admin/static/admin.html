<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nexus · 控制面</title>

<!--
  The shell, and nothing else. Every table, form and dialog in this console is
  built at runtime from `admin.js`, which is why there are six empty <section>s
  below and no markup inside them.

  Operations do not live under their lists any more. Wanting to change one
  business line's daily limit used to mean finding its row, then scrolling to a
  form at the foot of the page and picking that business line again from a
  dropdown -- two independent chances to act on the wrong one, both of which
  write to the effective policy. Every action now opens from the row it belongs
  to, with the subject already filled in and not editable.
-->
<link rel="stylesheet" href="/admin/static/admin.css">

<div id="login" hidden>
  <!-- Serving this anonymously gives away nothing but the surface's own
       existence: every panel it draws needs a session, and the credential
       never travels in the URL. -->
  <div class="login-card">
    <div class="login-head">
      <h1 class="wordmark">NE<b>X</b>US</h1>
      <p class="login-sub">万尔玛集团 AI 中台 · 控制面</p>
    </div>
    <div class="login-body">
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="u">管理员</label>
          <input id="u" name="username" autocomplete="username" autofocus>
        </div>
        <div class="field">
          <label for="p">密码</label>
          <input id="p" name="password" type="password" autocomplete="current-password">
        </div>
        <button class="primary" type="submit">登 录</button>
      </form>
      <p class="login-err" id="login-err"></p>
      <p class="login-foot">
        账号只能从命令行创建，密码不经过网络也不进任何文件：<br>
        <code>make admin-add USER=&lt;name&gt;</code>
      </p>
    </div>
  </div>
</div>

<div id="app" hidden>
  <aside class="rail">
    <div class="rail-head">
      <h1 class="wordmark">NE<b>X</b>US</h1>
      <p class="login-sub">CONTROL PLANE</p>
    </div>
    <nav id="nav">
      <button class="nav-item" data-view="overview">总览
        <span class="nav-count" id="n-alerts">–</span></button>
      <button class="nav-item" data-view="tenants">业务管理
        <span class="nav-count" id="n-tenants">–</span></button>
      <button class="nav-item" data-view="keys">密钥管理
        <span class="nav-count" id="n-keys">–</span></button>
      <button class="nav-item" data-view="perms">权限管理
        <span class="nav-count" id="n-perms">–</span></button>
      <button class="nav-item" data-view="audit">操作日志</button>
      <button class="nav-item" data-view="admins">账户管理
        <span class="nav-count" id="n-admins">–</span></button>
    </nav>
    <div class="rail-foot">
      <div class="who">
        <span id="who-name">—</span> · <span class="role" id="who-role">—</span>
      </div>
      <div class="acts">
        <button class="tiny" id="btn-passwd">改密码</button>
        <button class="tiny" id="btn-logout">退出</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="upstream-bar" id="upstream-bar" hidden></div>
    <div class="topbar">
      <h1 id="view-title">总览</h1>
      <span class="hint" id="view-hint"></span>
      <span class="spacer"></span>
      <button class="tiny" id="btn-refresh">刷新</button>
    </div>

    <section class="view" id="v-overview" hidden></section>
    <section class="view" id="v-tenants" hidden></section>
    <section class="view" id="v-keys" hidden></section>
    <section class="view" id="v-perms" hidden></section>
    <section class="view" id="v-audit" hidden></section>
    <section class="view" id="v-admins" hidden></section>
  </main>
</div>

<dialog id="dlg"></dialog>
<div id="toast"></div>

<script src="/admin/static/terms.js"></script>
<script src="/admin/static/admin.js"></script>
</html>
